name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java version."
            exit 1
          fi
          echo "Active Java major version detected: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Creating temporary debug keystore at ./debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Temporary debug keystore could not be created at ./debug.keystore."
            exit 1
          fi

          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching discovered APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" || echo "No APKs found."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file exists but is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: APK file does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"

          RUNNER_TEMP_DIR="$(mktemp -d)"
          FINAL_ASSET_PATH="${RUNNER_TEMP_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$FINAL_ASSET_PATH"

          echo "asset_path=${FINAL_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${FINAL_ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not end in .apk: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(printf '%s\n' \
            "### Automated Debug APK Build" \
            "- **Build Status**: Automatically generated debug APK built by GitHub Actions." \
            "- **Workflow Run Number**: ${{ github.run_number }}" \
            "- **Workflow Attempt**: ${{ github.run_attempt }}" \
            "- **Source Commit**: ${{ github.sha }}" \
            "- **Notice**: This APK is intended for testing and development. It is signed only with a temporary debug keystore and is not a production release.")

          echo "Publishing release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_PAGE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "===================================================="
            echo "Release Publishing Succeeded"
            echo "===================================================="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Direct GitHub Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            echo "===================================================="

            {
              echo "### 🚀 Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **APK Asset Filename**: \`${ASSET_NAME}\`"
              echo "- **Release Page**: [View Release and Download APK](${RELEASE_PAGE_URL})"
              echo ""
              echo "> 📥 **Direct Download**: You can download \`${ASSET_NAME}\` directly under the **Assets** section of the [GitHub Release](${RELEASE_PAGE_URL}) on your phone or browser."
              echo ""
              echo "> 📦 **Backup Artifact**: The standard GitHub Actions artifact named \`app-debug-apk\` is also stored in this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or was skipped. The Actions artifact remains available."
            echo "===================================================="
            echo "APK Build Succeeded"
            echo "Actions Artifact: app-debug-apk"
            echo "===================================================="

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Warning)"
              echo ""
              echo "- **APK Build Status**: Succeeded ✅"
              echo "- **Actions Artifact Name**: \`app-debug-apk\`"
              echo ""
              echo "> 📦 **Artifact Available**: The debug APK was built successfully and is preserved in the Actions artifact named **\`app-debug-apk\`**."
              echo "> ⚠️ **Release Note**: GitHub Release publishing encountered an issue or lacked write access, but your completed APK artifact was not lost and can be downloaded from the Actions summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
