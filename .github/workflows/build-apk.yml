name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="nxmusic Debug APK v${{ github.run_number }}.${{ github.run_attempt }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_NAME="app-debug-v${{ github.run_number }}.${{ github.run_attempt }}.apk"

          cp "$APK_PATH" "$ASSET_NAME"

          gh release create "$RELEASE_TAG" "$ASSET_NAME" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Android debug APK build from commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="nxmusic Debug APK v${{ github.run_number }}.${{ github.run_attempt }}"
          ASSET_NAME="app-debug-v${{ github.run_number }}.${{ github.run_attempt }}.apk"
          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "===================================================="
            echo "Release Publishing Succeeded"
            echo "===================================================="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Direct GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            echo "===================================================="

            {
              echo "### 🚀 APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **APK Asset Filename**: \`${ASSET_NAME}\`"
              echo "- **Direct Release Page**: [View Release and Download APK](${RELEASE_URL})"
              echo ""
              echo "> 📥 **How to download**: You can download the \`${ASSET_NAME}\` directly from the **Assets** section of the [GitHub Release](${RELEASE_URL})."
              echo ""
              echo "> 📦 **Actions Artifact Backup**: The normal GitHub Actions artifact named \`app-debug-apk\` is also stored and available for download in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or was skipped. The APK artifact remains safely preserved."
            echo "===================================================="
            echo "APK Build Succeeded"
            echo "Actions Artifact: app-debug-apk"
            echo "===================================================="

            {
              echo "### ⚠️ APK Build Succeeded (Release Publishing Note)"
              echo ""
              echo "- **APK Build Status**: Succeeded ✅"
              echo "- **Actions Artifact Name**: \`app-debug-apk\`"
              echo ""
              echo "> 📦 **Artifact Available**: The debug APK was built successfully and is preserved in the Actions artifact named **\`app-debug-apk\`** at the top/bottom of this workflow run page."
              echo "> ⚠️ **Release Note**: Publishing to GitHub Releases could not complete (or was not permitted), but your build artifact is fully intact and downloadable."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
