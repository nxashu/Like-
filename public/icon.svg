<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Outer Vinyl Disc Rings -->
  <circle cx="256" cy="256" r="180" fill="url(#discGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="10 4" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Center Glowing Accent Circle -->
  <circle cx="256" cy="256" r="76" fill="#000000" stroke="url(#neonGrad)" stroke-width="5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="76" fill="#000000" stroke="url(#neonGrad)" stroke-width="4" />

  <!-- Sound Waves / Music Note Icon -->
  <g transform="translate(196, 186)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 30 110 L 30 35 C 30 25 38 18 48 20 L 100 30 C 108 32 114 38 114 46 L 114 100" />
    <circle cx="16" cy="114" r="18" fill="#ffffff" />
    <circle cx="100" cy="104" r="18" fill="#ffffff" />
  </g>
</svg>
